<!-- Wildcard concept: "Which homepage would you click? A or B" - comment bait -->
<style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;overflow:hidden;font-family:-apple-system,"Segoe UI",Inter,Arial,sans-serif;background:{{BG}};color:{{INK}};position:relative}
.tag{position:absolute;left:64px;top:56px;display:flex;align-items:center;gap:10px;font-size:26px;font-weight:700}
.tag i{width:40px;height:40px;border-radius:11px;background:{{CHIP}};display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:22px}
h1{position:absolute;left:64px;right:64px;top:116px;font-size:72px;font-weight:850;letter-spacing:-2.2px;line-height:1.04}
.col{position:absolute;top:360px;width:448px;height:760px}
.col.a{left:64px}.col.b{right:64px}
.lbl{position:absolute;top:-34px;left:50%;transform:translateX(-50%);z-index:3;width:84px;height:84px;border-radius:50%;background:{{INK}};color:{{BG}};font-size:48px;font-weight:900;display:flex;align-items:center;justify-content:center}
.scr{position:absolute;inset:0;border-radius:34px;overflow:hidden;background:#fff;box-shadow:0 28px 60px rgba(0,0,0,.25);border:8px solid {{INK}}}
.old{padding:60px 22px 22px;font-family:"Times New Roman",serif;color:#222;background:#f1f1f1;height:100%}
.old h3{font-size:34px;color:#0000cc;text-decoration:underline;margin-bottom:8px}
.old p{font-size:20px;line-height:1.3;margin-bottom:10px}
.old .bl{height:14px;background:#cfcfcf;margin-bottom:8px;border-radius:2px}
.old .bn{display:inline-block;background:#ffec00;border:3px solid red;color:red;font-weight:bold;font-size:20px;padding:6px 10px;transform:rotate(-3deg);margin:8px 0}
.old .hit{font-size:16px;color:#666;margin-top:14px}
.new{height:100%;overflow:hidden;background:#fff}
.new img{width:100%;display:block}
.hint{position:absolute;left:64px;right:64px;bottom:120px;font-size:44px;font-weight:850;text-align:center;letter-spacing:-1px}
.hint span{color:{{ACCENT}}}
.foot{position:absolute;left:64px;bottom:44px;font-size:28px;font-weight:800}.foot span{color:{{ACCENT}}}
</style>
<div class="tag"><i>🌱</i>Websprout</div>
<h1>{{HEADLINE}}</h1>
<div class="col a"><div class="lbl">A</div><div class="scr"><div class="old">
<h3>{{NAME}} - Home</h3>
<p><b>WELCOME!!</b> to the website of {{NAME}}. We are a {{TYPE}} in {{CITY}}. Please call us.</p>
<div class="bl"></div><div class="bl" style="width:80%"></div><div class="bl"></div>
<div class="bn">CLICK HERE!!</div>
<p>Last updated: a while ago. You are visitor number 004211.</p>
<div class="bl" style="width:60%"></div><div class="bl"></div>
<p class="hit">Page 1 of 1 &middot; Best viewed on a desktop</p>
</div></div></div>
<div class="col b"><div class="lbl">B</div><div class="scr"><div class="new"><img src="{{PHONE}}"></div></div></div>
<div class="hint">Comment <span>A</span> or <span>B</span> below</div>
<div class="foot"><span>🌱</span> websprout.app</div>
