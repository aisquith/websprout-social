<!-- Wildcard concept: a customer texts the owner asking for their website. Generic chat UI (no real app branding). -->
<style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;overflow:hidden;font-family:-apple-system,"Segoe UI",Inter,Arial,sans-serif;background:{{BG}};color:{{INK}};position:relative}
.tag{position:absolute;left:64px;top:60px;display:flex;align-items:center;gap:10px;font-size:26px;font-weight:700}
.tag i{width:40px;height:40px;border-radius:11px;background:{{CHIP}};display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:22px}
h1{position:absolute;left:64px;right:64px;top:128px;font-size:62px;font-weight:850;letter-spacing:-1.8px;line-height:1.05}
.chat{position:absolute;left:64px;right:64px;top:330px;bottom:120px;background:#fff;border-radius:36px;padding:34px 34px;box-shadow:0 30px 80px rgba(0,0,0,.25);color:#111;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.who{font-size:20px;color:#8a8f98;text-align:center;margin-bottom:4px}
.b{max-width:78%;font-size:30px;line-height:1.3;padding:18px 24px;border-radius:28px}
.l{align-self:flex-start;background:#eceef1;border-bottom-left-radius:8px}
.r{align-self:flex-end;background:#2f7d3b;color:#fff;border-bottom-right-radius:8px}
.time{align-self:center;font-size:20px;color:#8a8f98;margin:6px 0}
.card{align-self:flex-end;width:62%;flex-shrink:0;border-radius:24px;overflow:hidden;border:1px solid #e3e5e8;background:#fff}
.card .img{height:330px;overflow:hidden}.card img{width:100%;display:block}
.card .meta{padding:14px 18px;font-size:22px;color:#555}.card .meta b{display:block;color:#111;font-size:24px}
.foot{position:absolute;left:64px;bottom:50px;font-size:28px;font-weight:800}.foot span{color:{{ACCENT}}}
</style>
<div class="tag"><i>🌱</i>Websprout</div>
<h1>{{HEADLINE}}</h1>
<div class="chat">
  <div class="who">Customer</div>
  <div class="b l">Hi! Do you have a website? Want to see your prices before I book</div>
  <div class="b r">Umm just my Facebook page 😅</div>
  <div class="time">10 seconds later</div>
  <div class="card"><div class="img"><img src="{{PHONE}}"></div><div class="meta"><b>{{NAME}}</b>{{HOST}}</div></div>
  <div class="b l">Oh nice, perfect 👍</div>
</div>
<div class="foot">Make yours free at <span>websprout.app</span></div>
